<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Just the flame mark on a transparent canvas, no badge card behind
       it: the previous version's dark inner square (#050505) WAS the
       visible "background" being reported. Filled (not stroke-only)
       with the same orange-500 to red-600 gradient used elsewhere in
       the app, so it stays clearly visible at favicon size on both
       light and dark browser tab bars without needing a colored card
       behind it. -->
  <defs>
    <linearGradient id="flameGradient" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  <g transform="translate(2,2) scale(1.15)">
    <path
      d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"
      fill="url(#flameGradient)"
      stroke="#fb923c"
      stroke-width="0.75"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
